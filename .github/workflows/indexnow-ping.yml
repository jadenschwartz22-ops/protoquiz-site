name: IndexNow ping on deploy

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "blog/feed.xml"
      - "llms.txt"
      - "robots.txt"
      # The census build pushes generated pages nightly; they have their own
      # diff-based submitter (scripts/census-indexnow.mjs), so this workflow —
      # which resubmits the whole hand-maintained sitemap — must not fire on
      # them. GitHub rejects paths + paths-ignore on one event, so this is a
      # negative pattern, and it must stay LAST: patterns are evaluated in
      # order and a later positive would re-include what it excluded.
      - "!census/**"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for GitHub Pages to serve the new build
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-ping.mjs
